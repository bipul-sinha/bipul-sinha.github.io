<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The old vertical computer industry, circa 1980</title>
<desc>Four companies, IBM, DEC, Sperry Univac and Wang, each built every layer of their own stack in isolation: sales and distribution, application software, operating system, computer, and chips.</desc>
