<rect x="30" y="30" width="60" height="4" fill="#145E66"/>
<text x="430.0" y="62" text-anchor="middle" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#1C1B18">The old vertical computer industry</text>
<text x="430.0" y="90" text-anchor="middle" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#78766E">circa 1980</text>
<line x1="30" y1="108" x2="830" y2="108" stroke="#B9B6AB" stroke-width="1"/>
<text x="30" y="156" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">sales and</text>
<text x="30" y="172" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">distribution</text>
<text x="30" y="218" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">application</text>
<text x="30" y="234" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">software</text>
<text x="30" y="280" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">operating</text>
<text x="30" y="296" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">system</text>
<text x="30" y="350" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">computer</text>
<text x="30" y="412" font-family="'Rubik', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#78766E">chips</text>
