<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The new horizontal computer industry, circa 1995</title>
<desc>Each layer of the stack, sales and distribution, application software, operating system, computer, and chips, is now its own horizontal market with its own set of competitors, not tied to a single vertically integrated company.</desc>
